<!doctype html>
<html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Heizlast HA · Lokale Vorschau</title><style>
:root{--primary-color:#007da8;--text-primary-color:#fff;--primary-background-color:#f2f5f7;--secondary-background-color:#f2f6f8;--card-background-color:#fff;--primary-text-color:#18303e;--secondary-text-color:#657784;--divider-color:#dbe4e9;--app-header-background-color:#007da8;--app-header-text-color:#fff}
:root[data-theme=dark]{color-scheme:dark;--primary-color:#48c3eb;--text-primary-color:#102027;--primary-background-color:#101b23;--secondary-background-color:#24343e;--card-background-color:#1c2a33;--primary-text-color:#e7eff4;--secondary-text-color:#adbdc9;--divider-color:#354a58;--app-header-background-color:#243b49}
:root[data-theme=custom]{--primary-color:#6941a5;--text-primary-color:#fff;--primary-background-color:#f8f5fc;--secondary-background-color:#f1ebf8;--card-background-color:#fff;--primary-text-color:#2f2340;--secondary-text-color:#665777;--divider-color:#d5c8e3;--app-header-background-color:#6941a5}
*{box-sizing:border-box}body{margin:0;background:var(--primary-background-color);color:var(--primary-text-color);font:14px system-ui,-apple-system,sans-serif}.devbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 24px;background:var(--card-background-color);border-bottom:1px solid var(--divider-color)}.devbar span{font-size:11px;color:var(--secondary-text-color)}.controls{display:flex;gap:6px;flex-wrap:wrap}.controls button{font:inherit;font-size:11px;border:1px solid var(--divider-color);border-radius:7px;background:var(--card-background-color);color:var(--primary-text-color);padding:7px 10px;cursor:pointer}.dev-note{padding:0 24px 22px;text-align:center;color:var(--secondary-text-color);font-size:11px;line-height:1.6}@media(max-width:600px){.devbar{padding:10px 12px}}
</style></head><body><div class="devbar"><span>Lokale Vorschau · dokumentierte Planungsdaten · keine simulierten Messwerte</span><div class="controls"><button id="theme">Theme: Hell</button><button id="rights">Leseansicht</button><button id="reset">Lokale Zuordnungen zurücksetzen</button></div></div><heizlast-ha-panel></heizlast-ha-panel><p class="dev-note">Die Vorschau nutzt lokalen Browser-Speicher und enthält keine Sensoren.<br/>In Home Assistant können vorhandene Temperatursensoren zugeordnet werden.</p><script type="module" src="/src/dev.ts"></script></body></html>
