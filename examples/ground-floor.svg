<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <title>Beispielgrundriss Erdgeschoss mit vier Räumen</title>
  <desc>Technische schematische Zeichnung mit Wohnzimmer, Küche, Flur und Bad. Alle Raumkoordinaten beziehen sich auf 1200 mal 800 Pixel; kein metrischer Maßstab.</desc>
  <rect width="1200" height="800" fill="#fff"/>
  <g fill="#30343b">
    <rect x="90" y="90" width="1020" height="620"/>
  </g>
  <g fill="#f6f6f4">
    <rect x="110" y="110" width="480" height="580"/>
    <rect x="610" y="110" width="480" height="240"/>
    <rect x="610" y="370" width="480" height="110"/>
    <rect x="610" y="500" width="480" height="190"/>
  </g>
  <g fill="#30343b" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle">
    <text x="350" y="410">Wohnzimmer</text>
    <text x="850" y="240">Küche</text>
    <text x="850" y="435">Flur</text>
    <text x="850" y="605">Bad</text>
  </g>
  <g fill="#62666c" font-family="Arial, Helvetica, sans-serif" font-size="20">
    <text x="90" y="55">Erdgeschoss · Beispielgrundriss</text>
    <text x="90" y="755">1200 × 800 Pixel · schematisch · kein metrischer Maßstab</text>
  </g>
</svg>
