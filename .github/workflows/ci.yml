name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code, tests and CI documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      integration: ${{ steps.components.outputs.integration }}
      frontend: ${{ steps.components.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install quality tools
        run: python -m pip install -r requirements-ci.txt
      - name: Require CI documentation updates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python scripts/check_ci_docs.py --base "$BASE_SHA" --head "$HEAD_SHA"
          --event "$EVENT_NAME"
      - name: Validate workflow syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz \
            --dir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" \
            -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: Check Python code and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run Python tests
        run: python -m pytest
      - name: Detect integration and dashboard
        id: components
        run: |
          if [ -d custom_components ]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "integration=false" >> "$GITHUB_OUTPUT"
            echo "No integration yet; Hassfest will be skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -d frontend ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No dashboard sources yet; frontend checks will be skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  hassfest:
    name: Home Assistant integration validation
    needs: quality
    if: needs.quality.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  build:
    name: Dashboard checks and versioned build
    needs: [quality, hassfest]
    if: >-
      always() && !cancelled() && needs.quality.result == 'success' &&
      (needs.hassfest.result == 'success' || needs.hassfest.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.quality.outputs.frontend == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check and build dashboard
        if: needs.quality.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: Build versioned project archive
        env:
          BUILD_ID: ci.${{ github.run_number }}.${{ github.run_attempt }}
        run: python scripts/build.py --build-id "$BUILD_ID"
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heizlast-ha-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
